events {}
http {
  upstream backend {
    least_conn;
    # PASSIVE health check: after 1 failed attempt, skip this server for 10s.
    server app1:8000 max_fails=1 fail_timeout=10s;
    server app2:8000 max_fails=1 fail_timeout=10s;
    server app3:8000 max_fails=1 fail_timeout=10s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://backend;
      proxy_connect_timeout 1s;                      # how long to wait on a dead server
      proxy_next_upstream error timeout;             # on failure, retry on the next server
      proxy_next_upstream_tries 3;
      add_header X-Upstream-Addr $upstream_addr always;  # shows every server tried
    }
  }
}
